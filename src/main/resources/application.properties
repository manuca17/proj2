spring.application.name=proj2

# URL de Conexao (Neon PostgreSQL)
spring.datasource.url=jdbc:postgresql://ep-late-bar-as4nzqi2.c-4.eu-central-1.aws.neon.tech/neondb?sslmode=require&socketTimeout=300

# Credenciais
spring.datasource.username=neondb_owner
spring.datasource.password=npg_eDQNgX4KAaP7

# Configuracoes do Hibernate
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jackson.property-naming-strategy=SNAKE_CASE

# HikariCP - estabilidade de conexao com Neon
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# Upload de ficheiros
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads